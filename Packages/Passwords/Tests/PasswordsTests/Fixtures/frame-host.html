<!doctype html>
<html><head><meta charset="utf-8"><title>Frame host</title></head>
<body>
<!-- The page's own login form, an iframe from another origin (localhost vs 127.0.0.1) with its
     own login form, and a sandboxed frame with an opaque origin. -->
<form id="login" onsubmit="event.preventDefault()">
  <input id="username" type="text" autocomplete="username">
  <input id="password" type="password">
</form>
<iframe id="other" src="http://localhost:{{PORT}}/frame-login.html" width="400" height="200"></iframe>
<iframe id="sandboxed" sandbox="allow-scripts allow-forms" width="400" height="200"
        srcdoc="<form><input id=username autocomplete=username><input id=password type=password></form>"></iframe>
</body></html>
