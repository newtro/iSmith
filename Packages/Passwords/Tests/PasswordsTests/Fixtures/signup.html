<!doctype html>
<html><head><meta charset="utf-8"><title>Create account</title></head>
<body>
<form id="signup" action="/done.html" method="post" onsubmit="event.preventDefault(); window.submitted = true;">
  <input id="email" name="email" type="email" autocomplete="email">
  <input id="new" name="new-password" type="password" autocomplete="new-password" maxlength="24"
         passwordrules="required: upper; required: digit; minlength: 12; maxlength: 24;">
  <input id="confirm" name="confirm-password" type="password" autocomplete="new-password">
  <button id="create" type="submit">Create account</button>
</form>
</body></html>
