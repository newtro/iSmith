<!doctype html>
<html><head><meta charset="utf-8"><title>Things drawn over fields</title>
<style>
  form { margin: 10px 0; }
  .wrap { position: relative; display: inline-block; vertical-align: top; width: 400px; margin-right: 30px; }
  .wrap input { display: block; width: 100%; height: 32px; box-sizing: border-box; }
  .over { position: absolute; left: 0; top: 0; width: 100%; height: 32px; }
  .big { position: absolute; left: -20px; top: 0; width: 440px; height: 32px; }
  /* Sized like Microsoft's hint: the top of the field, its lower edge left clear. */
  .ms { position: absolute; left: 0; top: 4px; width: 100%; height: 20px; font-size: 15px; line-height: 20px; color: #666; }
  #t7 .ms::before { content: ""; position: absolute; left: 0; top: -4px; width: 400px; height: 32px; background: white; }
  form.covered { position: relative; width: 400px; }
  form.covered input { display: inline-block; width: 100%; height: 32px; box-sizing: border-box; }
</style></head>
<body>
<!-- A hint drawn over a field counts as the field only while it is plain see-through text in
     the field's own wrapper, inside its box. None of these may get a popover or a fill. -->
<form id="t1"><div class="wrap"><input id="u1" autocomplete="username"><div class="over" style="background: white">Email</div></div><input id="p1" type="password"></form>
<form id="t2"><div class="wrap"><input id="u2" autocomplete="username"><div class="over"><img alt="" width="400" height="32" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div></div><input id="p2" type="password"></form>
<form id="t3"><div class="wrap"><input id="u3" autocomplete="username"><div class="big">Email</div></div><input id="p3" type="password"></form>
<form id="t4" class="covered"><input id="u4" autocomplete="username"><div class="over">Email</div><input id="p4" type="password"></form>
<form id="t5"><div class="wrap"><input id="u5" autocomplete="username"><div class="over" style="box-shadow: inset 0 0 0 40px white">Email</div></div><input id="p5" type="password"></form>
<form id="t6"><div class="wrap"><input id="u6" autocomplete="username"><div class="over" style="backdrop-filter: blur(10px)">Email</div></div><input id="p6" type="password"></form>
<!-- Hints the size of Microsoft's that paint over the whole field some other way. -->
<form id="t7"><div class="wrap"><input id="u7" autocomplete="username"><div class="ms">Email</div></div><input id="p7" type="password"></form>
<form id="t8"><div class="wrap"><input id="u8" autocomplete="username"><div class="ms" id="h8"></div></div><input id="p8" type="password"></form>
<form id="t9"><div class="wrap"><input id="u9" autocomplete="username"><div class="ms" style="-webkit-text-stroke: 40px white">MMMMMMMMMMMM</div></div><input id="p9" type="password"></form>
<form id="t10"><div class="wrap"><input id="u10" autocomplete="username"><div class="ms" style="text-shadow: 0 0 0 white, 0 12px 0 white, 0 -12px 0 white">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;</div></div><input id="p10" type="password"></form>
<form id="t11"><div class="wrap"><input id="u11" autocomplete="username"><div class="ms" style="font-size: 60px; color: white">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;</div></div><input id="p11" type="password"></form>
<!-- The control: a see-through text hint, as Microsoft draws. -->
<form id="ok" onsubmit="event.preventDefault()"><div class="wrap"><input id="uok" autocomplete="username"><div class="ms" id="hok">Email</div></div><input id="pok" type="password"></form>
<script>
  // A closed shadow root (which the script can't look into) painting over the whole field.
  const root = document.getElementById("h8").attachShadow({ mode: "closed" });
  root.innerHTML = '<div style="position: absolute; left: 0; top: -4px; width: 400px; height: 32px; background: white"></div>';
</script>
</body></html>
