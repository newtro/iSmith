name: iSmith
options:
  bundleIdPrefix: com.scottsmith
  deploymentTarget:
    macOS: "14.0"
packages:
  SignInSync:
    path: Packages/SignInSync
  BrowserData:
    path: Packages/BrowserData
  Routing:
    path: Packages/Routing
  Blocking:
    path: Packages/Blocking
  Passwords:
    path: Packages/Passwords
  BraveImport:
    path: Packages/BraveImport
  AgentKit:
    path: Packages/AgentKit
  Codes:
    path: Packages/Codes
  SiteCheck:
    path: Packages/SiteCheck
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Tools/release.sh passes the real values when it archives a release.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 232A77467G
    CODE_SIGN_STYLE: Automatic
targets:
  iSmith:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SignInSync
      - package: BrowserData
      - package: Routing
      - package: Blocking
      - package: Passwords
      - package: BraveImport
      - package: AgentKit
      - package: Codes
        product: CodesXPC
      - package: SiteCheck
      - package: Sparkle
      # iSmith Agent (SMS codes from the phone), in Contents/Library/LoginItems; its launchd plist
      # is written by the script below.
      - target: iSmithAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    postBuildScripts:
      # The plist SMAppService.agent(plistName:) loads, from build settings, because XcodeGen can't
      # give a file different contents per configuration: Debug's agent is
      # com.scottsmith.ismith.debug.agent with the Mach service 232A77467G.com.scottsmith.ismith.debug.agent,
      # Release's com.scottsmith.ismith.agent. It runs before Xcode signs the app, so the seal covers it.
      - name: Write the iSmith Agent launchd plist
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/$(PRODUCT_BUNDLE_IDENTIFIER).agent.plist
        script: |
          set -euo pipefail
          agent_id="${PRODUCT_BUNDLE_IDENTIFIER}.agent"
          dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          plist="${dir}/${agent_id}.plist"
          program="Contents/Library/LoginItems/iSmith Agent.app/Contents/MacOS/iSmith Agent"
          test -x "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems/iSmith Agent.app/Contents/MacOS/iSmith Agent" \
            || { echo "error: iSmith Agent isn't embedded"; exit 1; }
          embedded_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems/iSmith Agent.app/Contents/Info.plist")"
          test "${embedded_id}" = "${agent_id}" \
            || { echo "error: the embedded agent is ${embedded_id}, expected ${agent_id}"; exit 1; }
          mkdir -p "${dir}"
          rm -f "${dir}"/*.plist
          /usr/bin/plutil -create xml1 "${plist}"
          /usr/bin/plutil -insert Label -string "${agent_id}" "${plist}"
          /usr/bin/plutil -insert BundleProgram -string "${program}" "${plist}"
          /usr/bin/plutil -insert AssociatedBundleIdentifiers -array "${plist}"
          /usr/bin/plutil -insert AssociatedBundleIdentifiers.0 -string "${PRODUCT_BUNDLE_IDENTIFIER}" "${plist}"
          /usr/bin/plutil -insert MachServices -dictionary "${plist}"
          /usr/libexec/PlistBuddy -c "Add :MachServices:${DEVELOPMENT_TEAM}.${agent_id} bool true" "${plist}"
          /usr/bin/plutil -insert KeepAlive -bool true "${plist}"
          /usr/bin/plutil -insert RunAtLoad -bool true "${plist}"
          /usr/bin/plutil -insert ProcessType -string Interactive "${plist}"
          /usr/bin/plutil -lint "${plist}"
    info:
      path: App/Info.plist
      properties:
        # "iSmith" in Release, "iSmith Dev" in Debug (ISMITH_DISPLAY_NAME below), so a dev build
        # never looks like, or shares data with, the installed app.
        CFBundleDisplayName: $(ISMITH_DISPLAY_NAME)
        CFBundleName: $(ISMITH_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSCameraUsageDescription: Websites you allow can use the camera, for example for Teams calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for Teams calls.
        NSLocationUsageDescription: Websites you allow can use your location, for example to find nearby places.
        SUFeedURL: https://raw.githubusercontent.com/newtro/iSmith/main/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUPublicEDKey: Ezl8lB6Z6JnAQ08oLRWy8uOWsNpPxzlNEV4d5+xFyEU=
        # A browser has to load plain-http sites. This lifts App Transport Security for web
        # views only; iSmith's own network calls (Sparkle, agent, sync) still require https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # P6: iSmith opens web links (so it's listed as a default browser) and HTML documents.
        # Documents rank as Alternate, so installing iSmith never takes over .html files by itself.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.xhtml]
          - CFBundleTypeName: Web archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.webarchive]
        # Drag types for tabs and spaces inside the app (the tab strip, the rail, other windows).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).tab
            UTTypeDescription: iSmith tab
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).space
            UTTypeDescription: iSmith space
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).bookmark
            UTTypeDescription: iSmith bookmark
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).group
            UTTypeDescription: iSmith tab group
            UTTypeConformsTo: [public.data]
    entitlements:
      path: App/iSmith.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_NAME: iSmith
        ENABLE_HARDENED_RUNTIME: YES
      # Debug is "iSmith Dev": its own bundle id, so its own WebKit stores, Keychain items
      # (derived from the bundle id), notification settings and data folder. Release is the
      # installed app.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.scottsmith.ismith.debug
          ISMITH_DISPLAY_NAME: iSmith Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.scottsmith.ismith
          ISMITH_DISPLAY_NAME: iSmith
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [iSmithTests]
  # iSmith Agent: the background helper that receives SMS codes from the paired phone (2FASync)
  # and answers iSmith over XPC. No Dock icon (LSUIElement). Embedded in iSmith.app and started by
  # launchd once the app registers it; see Packages/Codes/INTEGRATION.md.
  iSmithAgent:
    type: application
    platform: macOS
    sources:
      - Agent
      - path: App/Assets.xcassets
    dependencies:
      - package: Codes
        product: Codes
    info:
      path: Agent/Info.plist
      properties:
        CFBundleDisplayName: $(ISMITH_AGENT_DISPLAY_NAME)
        CFBundleName: $(ISMITH_AGENT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: iSmith Agent
        ENABLE_HARDENED_RUNTIME: YES
        # Shipped only inside iSmith.app, never as an archive product of its own.
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.scottsmith.ismith.debug.agent
          ISMITH_AGENT_DISPLAY_NAME: iSmith Dev Agent
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.scottsmith.ismith.agent
          ISMITH_AGENT_DISPLAY_NAME: iSmith Agent
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  iSmithTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: iSmith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottsmith.ismith.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iSmith.app/Contents/MacOS/iSmith
        BUNDLE_LOADER: $(TEST_HOST)
